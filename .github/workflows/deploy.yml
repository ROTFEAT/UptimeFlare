name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptimeflare-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 94d197e33c0d7c88c00816c99445ddcc
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix worker

      - name: Validate Worker bundle
        working-directory: worker
        run: npx wrangler deploy --dry-run

      - name: Build status page and check types
        run: npx @cloudflare/next-on-pages

      - name: Check deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add the CLOUDFLARE_API_TOKEN Actions secret in repository settings (Edit Cloudflare Workers template plus D1 Edit). No Cloudflare resources have been changed.'
            exit 1
          fi

      # Resources already exist. The checked-in Wrangler files are authoritative.
      # Do not run Terraform imports or recreate the production database.
      - name: Sync Feishu Worker secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo '::error::Add the FEISHU_WEBHOOK_URL Actions secret before deploying.'
            exit 1
          fi
          printf '%s' "$FEISHU_WEBHOOK_URL" | npx wrangler secret put FEISHU_WEBHOOK_URL

      - name: Deploy monitor and ten-minute schedule
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Deploy production status page
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler pages deploy .vercel/output/static --project-name uptimeflare --branch main
